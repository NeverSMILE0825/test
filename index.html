  <body>
    <div id="root"></div>
    <div id="boot">
      <div class="card">
        <strong>Loading Apeing…</strong>
        <p id="boot-msg">If this stays blank, click retry to clear cache.</p>
        <button type="button" id="boot-retry">Retry</button>
      </div>
    </div>
    <script>
      (function () {
        var VERSION = 'v3'
        var bootMsg = document.getElementById('boot-msg')
        var retry = document.getElementById('boot-retry')

        function hardReload() {
          try {
            sessionStorage.removeItem('apeing_cache_bust_v2')
            sessionStorage.removeItem('apeing_cache_bust_v3')
            localStorage.removeItem('apeing_boot_fail')
          } catch (e) {}
          var url = new URL(window.location.href)
          url.searchParams.set('v', VERSION)
          url.searchParams.set('_', String(Date.now()))
          window.location.replace(url.toString())
        }

        retry.addEventListener('click', hardReload)

        window.addEventListener('error', function (e) {
          if (bootMsg) {
            bootMsg.textContent =
              'Load error: ' + (e.message || 'unknown') + '. Click Retry.'
          }
        })

        window.addEventListener('load', function () {
          setTimeout(function () {
            var root = document.getElementById('root')
            if (root && root.childElementCount > 0) return
            var key = 'apeing_cache_bust_' + VERSION
            var tries = Number(sessionStorage.getItem(key) || '0')
            if (tries < 2) {
              sessionStorage.setItem(key, String(tries + 1))
              hardReload()
              return
            }
            if (bootMsg) {
              bootMsg.textContent =
                'App failed to start. Click Retry (or Ctrl+Shift+R).'
            }
          }, 2000)
        })
      })()
    </script>
